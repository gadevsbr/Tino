# Regras de fluxo de atendimento automático
# Quando nenhuma regra corresponde, o sistema pode usar um serviço de IA (se configurado e habilitado)
# para gerar respostas mais inteligentes
rules:
  - name: horario
    contains: horario
    reply: "Nosso horário de atendimento é de segunda a sexta, das 9h às 18h."
  - name: atendente
    contains: atendente
    reply: "Recebemos sua solicitação. Uma pessoa da equipe continuará o atendimento."
default_reply: "Obrigado pela mensagem. Digite 'horario' ou 'atendente'."
